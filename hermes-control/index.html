<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Hermes · 人工接管</title>
<style>body{font:16px system-ui;margin:28px;background:#eef2f6;color:#203447}main{display:grid;grid-template-columns:minmax(520px,1fr) 420px;gap:24px}section{background:white;border-radius:14px;padding:22px;margin-bottom:18px}button,input,textarea{font:inherit;padding:10px;margin:5px 0}button{cursor:pointer;border:0;border-radius:7px;background:#225ddd;color:white}button:disabled{opacity:.4}input,textarea{box-sizing:border-box;width:100%;border:1px solid #aab6c5;border-radius:6px}textarea{min-height:90px}img{width:100%;border:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#b12222}small{color:#5c6c80}</style>
<h1>Hermes 模型驱动与人工接管</h1><p>同一个 ACS 沙箱、同一浏览器页面。先让 Hermes 搜索与起草，接管登录或修改，再交回继续。</p><p id="status">正在连接…</p><p id="error"></p>
<main><div><section><img id="screen" alt="云端浏览器当前画面"><small>画面每 3 秒刷新。右侧控件直接操作此页面；不是新浏览器。</small></section><section><h2>Hermes 执行结果</h2><pre id="result"></pre><details><summary>工具执行记录</summary><pre id="events"></pre></details></section></div>
<div><section><h2>1 · 模型驱动</h2><textarea id="prompt">先观察，把搜索框填入“演示”并搜索（此页面仅识别这个关键词）。找到陈女士后起草简短的产品试用回访内容。不要登录，不要提交，完成草稿后停止。</textarea><button id="run">交给 Hermes 执行</button> <button id="take">人工接管</button><p><small>接管确认后，旧的 Agent 操作会被拒绝。等待当前模型回合停止后即可再次交回。</small></p></section>
<section id="human"><h2>2 · 人工操作</h2><label>客户搜索<input id="search" placeholder="演示"></label><button data-action="search">搜索</button><label>账号<input id="username" value="demo" autocomplete="off"></label><label>密码<input id="password" type="password" autocomplete="off" placeholder="演示密码 demo-password"></label><button data-action="login">登录当前会话</button><label>跟进草稿<textarea id="draft"></textarea></label><button data-action="draft">把修改写入浏览器</button><p id="login"></p></section>
<section><h2>3 · 确认与释放</h2><button id="submit">审核并提交这份草稿</button><p id="receipt"></p><button id="stop">结束演示并释放沙箱</button><p><small>30 分钟后自动关闭并释放测试沙箱。模型和云资源按实际使用计费。</small></p></section></div></main>
<script>
let state, busy=false, operationId=crypto.randomUUID();
const $=id=>document.getElementById(id);
async function post(path,body={}){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({epoch:state?.browser.control.epoch,...body})});let j=await r.json();if(!r.ok)throw Error(j.error);return j;}
async function refresh(){if(busy)return;try{let r=await fetch('/state');let j=await r.json();if(!r.ok)throw Error(j.error);state=j;let b=j.browser,h=j.hermes,u=b.control.mode==='USER';$('screen').src='data:image/png;base64,'+b.image;$('status').textContent=`控制权：${u?'人工':'Hermes'} · 模型：${h.model} · ${h.busy?'执行中':'等待操作'} · 沙箱：${b.control.sandboxId}`;$('result').textContent=h.error||h.result?.final_response||'尚未执行';$('events').textContent=JSON.stringify(h.events,null,2);$('login').textContent=b.login;$('receipt').textContent=b.receipt;for(let id of ['search','username','draft'])if(document.activeElement!==$(id)&&!$(id).dataset.dirty)$(id).value=b.fields[id];$('take').disabled=u;$('run').disabled=h.busy;$('submit').disabled=!u||h.busy;document.querySelectorAll('#human button,#human input,#human textarea').forEach(e=>e.disabled=!u);}catch(e){$('error').textContent=e.message;}}
async function act(fn){busy=true;try{await fn();$('error').textContent='';}catch(e){$('error').textContent=e.message;}finally{busy=false;await refresh();}}
for(let id of ['search','username','draft'])$(id).oninput=()=>$(id).dataset.dirty='1';
$('run').onclick=()=>act(()=>post('/run',{prompt:$('prompt').value}));$('take').onclick=()=>act(()=>post('/takeover'));
document.querySelector('[data-action=search]').onclick=()=>act(async()=>{await post('/action',{action:'fill',selector:'search',value:$('search').value});await post('/action',{action:'click',selector:'find'});delete $('search').dataset.dirty;});
document.querySelector('[data-action=login]').onclick=()=>act(async()=>{await post('/action',{action:'fill',selector:'username',value:$('username').value});await post('/action',{action:'fill',selector:'password',value:$('password').value});await post('/action',{action:'click',selector:'login'});$('password').value='';delete $('username').dataset.dirty;});
document.querySelector('[data-action=draft]').onclick=()=>act(async()=>{await post('/action',{action:'fill',selector:'draft',value:$('draft').value});delete $('draft').dataset.dirty;});
$('submit').onclick=()=>{if(confirm('确认向虚构演示系统提交以下草稿？\n客户：'+state.browser.customer+'\n\n'+$('draft').value))act(()=>post('/submit',{draft:$('draft').value,customer:state.browser.customer,operationId}));};
$('stop').onclick=()=>act(async()=>{await post('/stop');$('status').textContent='正在结束并释放…';});
(async()=>{if(location.hash){let token=location.hash.slice(1);history.replaceState(null,'','/');await post('/auth',{token});}await refresh();setInterval(refresh,3000);})().catch(e=>$('error').textContent=e.message);
</script></html>
